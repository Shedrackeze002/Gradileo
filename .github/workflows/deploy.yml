name: Deploy to GitHub Pages and Cloudflare

# Runs the tests and publishes the app to Cloudflare at gradileo.com (wrangler.jsonc), once its
# secrets are set. GitHub Pages now serves a redirect from the old address to the same page on
# gradileo.com (MOVED_TO below); a copy that should serve the app on GitHub Pages removes MOVED_TO.
#
# Repository settings (Settings → Secrets and variables → Actions):
#   Secrets (for Cloudflare)
#     CLOUDFLARE_API_TOKEN    an API token with Workers Scripts: Edit (account) and Zone: Read and
#                             Workers Routes: Edit (zone gradileo.com); see docs/SETUP.md
#     CLOUDFLARE_ACCOUNT_ID   the Cloudflare account ID
#   Variables (optional)
#     VITE_SUPABASE_URL       Supabase project URL; overrides .env.production when set
#     VITE_SUPABASE_ANON_KEY  the project's anon / publishable key (safe to expose)
#     CUSTOM_DOMAIN           e.g. learn.yourschool.ca, once you have a domain
#     BASE_PATH               override the base path (defaults to /<repo>/, or / with a custom domain)
#
# Then set Settings → Pages → Source to "GitHub Actions".

on:
  push:
    branches: [main]
  # Merges made through an app (such as Claude's GitHub connection) do not start push workflows,
  # so a merged pull request into main deploys too. pull_request_target runs this workflow as it
  # is on main and the build checks out main, never the pull request's own code.
  pull_request_target:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # A closed pull request deploys only when it was merged.
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      MOVED_TO: https://gradileo.com
    outputs:
      cloudflare: ${{ steps.cloudflare.outputs.ready }}
    steps:
      # Secrets cannot be read in a job's condition, so the Cloudflare job asks this step.
      - name: Check the Cloudflare secrets
        id: cloudflare
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "Cloudflare secrets are not set; only GitHub Pages will be updated."; fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && 'main' || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Repository variables override .env.production only when they are set. They are
      # written to .env.production.local rather than passed as environment variables,
      # because an unset variable arrives as an empty string and would blank the backend.
      - name: Choose the backend
        run: |
          : > .env.production.local
          if [ -n "$URL" ]; then echo "VITE_SUPABASE_URL=$URL" >> .env.production.local; fi
          if [ -n "$KEY" ]; then echo "VITE_SUPABASE_ANON_KEY=$KEY" >> .env.production.local; fi
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - name: Build
        if: env.MOVED_TO == ''
        run: npm run build
        env:
          BASE_PATH: ${{ vars.BASE_PATH || (vars.CUSTOM_DOMAIN && '/') || format('/{0}/', github.event.repository.name) }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
      - name: Check the site is connected to its backend
        if: env.MOVED_TO == ''
        run: node scripts/check-backend.mjs
      - name: Redirect the old address to the new one
        if: env.MOVED_TO != ''
        run: node scripts/pages-redirect.mjs "$MOVED_TO" "/${{ github.event.repository.name }}/"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.MOVED_TO != '' && 'pages-redirect' || 'dist' }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  cloudflare:
    # Gradileo at gradileo.com: built for the root of the domain once the tests above have
    # passed, then deployed as a Worker serving static assets (wrangler.jsonc).
    needs: build
    if: needs.build.outputs.cloudflare == 'true'
    runs-on: ubuntu-latest
    environment:
      name: cloudflare
      url: https://gradileo.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && 'main' || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Choose the backend
        run: |
          : > .env.production.local
          if [ -n "$URL" ]; then echo "VITE_SUPABASE_URL=$URL" >> .env.production.local; fi
          if [ -n "$KEY" ]; then echo "VITE_SUPABASE_ANON_KEY=$KEY" >> .env.production.local; fi
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - name: Build for the root of gradileo.com
        run: npm run build
        env:
          BASE_PATH: /
      - name: Check the site is connected to its backend
        run: node scripts/check-backend.mjs
      # The AI tutor's recorded voice: each course's recordings are the files of a release that
      # the Tutor voice workflow makes (tutor-voice.yml); the site serves them at /tutor/.
      - name: Add the tutor's recorded voice
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/tutor
          for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName -q '.[].tagName' | grep '^tutor-voice-' || true); do
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir dist/tutor
          done
          echo "$(ls dist/tutor | grep -c '\.json$' || true) lessons have a recorded voice"
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.142.0
          command: deploy
