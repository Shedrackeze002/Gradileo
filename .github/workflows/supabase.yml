name: Deploy Supabase backend

# Applies database migrations and deploys the Edge Functions.
#
# Repository secrets (Settings → Secrets and variables → Actions → Secrets):
#   SUPABASE_ACCESS_TOKEN   personal access token from supabase.com/dashboard/account/tokens; a
#                           scoped token needs Connection Pooling (Read) and Edge Functions
#                           (Read-write) on the project
#   SUPABASE_PROJECT_ID     the project reference (the "abcd…" part of https://abcd….supabase.co)
#   SUPABASE_DB_PASSWORD    the database password chosen when the project was created
#
# Function secrets (MINIMAX_API_KEY, RESEND_API_KEY, …) are set once with
# `supabase secrets set`, see docs/SETUP.md.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'engine/**'
  # Merges made through an app do not start push workflows (see deploy.yml), so a merged pull
  # request into main deploys too. The job checks out main, never the pull request's own code.
  pull_request_target:
    types: [closed]
    branches: [main]
    paths:
      - 'supabase/**'
      - 'engine/**'

jobs:
  deploy:
    # A closed pull request deploys only when it was merged.
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_ID" ]; then
            echo "Supabase secrets are not set; skipping backend deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.skip != 'true'
        with:
          ref: ${{ github.event_name == 'pull_request_target' && 'main' || github.ref }}
      # A fixed version: "latest" asks GitHub's API which release that is, and a run failed when
      # that request hit the rate limit (16 October 2026).
      - uses: supabase/setup-cli@v1
        if: steps.cfg.outputs.skip != 'true'
        with:
          version: 2.121.0
      # `supabase link` asks for the project's secret API keys, which a scoped token is not given,
      # so the migrations go straight to the database. GitHub's runners cannot reach the database's
      # own host (IPv6 only), so they connect through the session pooler, whose address comes
      # from the Management API.
      - name: Apply migrations
        if: steps.cfg.outputs.skip != 'true'
        run: |
          if ! pooler=$(curl -sS --fail-with-body -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_ID/config/database/pooler"); then
            echo "::error::Could not read the pooler address (a scoped token needs Connection Pooling, Read): $pooler"
            exit 1
          fi
          password=$(jq -rn --arg p "$SUPABASE_DB_PASSWORD" '$p | @uri')
          echo "::add-mask::$password"
          db_url=$(jq -r --arg p "$password" '
            map(select(.database_type == "PRIMARY"))[0].connection_string // empty
            | sub(":\\[YOUR-PASSWORD\\]@"; ":" + $p + "@")
            | sub(":6543/"; ":5432/")' <<<"$pooler")
          if [ -z "$db_url" ]; then
            echo "::error::The project has no primary pooler connection."
            exit 1
          fi
          echo "::add-mask::$db_url"
          supabase db push --db-url "$db_url"
      - name: Deploy functions
        if: steps.cfg.outputs.skip != 'true'
        run: |
          node scripts/sync-engine.mjs
          supabase functions deploy grade-submission ai-agent ai-tutor create-students send-emails admin-users join-class --project-ref "$PROJECT_ID"
